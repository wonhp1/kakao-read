[project]
name = "kakao-read"
version = "0.2.0"
description = "카카오톡 PC 방 창을 화면 접근성으로 읽고 Claude 가 답장하는 도구 (macOS, 윈도우 준비 중)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyobjc-framework-ApplicationServices; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
    "comtypes>=1.4.13; sys_platform == 'win32'",
]

[project.scripts]
kakao-read = "kakao_read.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kakao_read"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
